version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    # Version-update PRs are off: dependency upgrades are made in the
    # maintainer's tree and published with the next release. Security alerts
    # stay on. The cooldown keeps any update PR off a release younger than a week.
    open-pull-requests-limit: 0
    cooldown: { default-days: 7 }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
    cooldown: { default-days: 7 }
