version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    # Version-update PRs are off: this repository is a mirror of the private
    # tree (release/sync-public.sh), so nothing can be merged here — upgrades
    # land upstream and arrive with the next sync. Security alerts stay on.
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
