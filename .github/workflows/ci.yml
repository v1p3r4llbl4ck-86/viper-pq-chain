name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Build parallelism is the runner's business: the hosted runners use every
  # core, the self-hosted ones carry CARGO_BUILD_JOBS in their environment.

# Pull requests always run on GitHub-hosted runners (free for a public
# repository, disposable): code from a fork never executes on the project's
# machines. Pushes to main and manual runs can be routed to the self-hosted
# runners (release/RUNNER.md in the private repository) by setting the
# repository variable CI_RUNS_ON to a JSON label list such as ["viper-k3s"].
jobs:
  lint:
    name: fmt, clippy, licences, links
    runs-on: ${{ github.event_name != 'pull_request' && vars.CI_RUNS_ON && fromJSON(vars.CI_RUNS_ON) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: runner.environment == 'github-hosted'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: scripts/check-licenses.sh
      - run: scripts/check-links.sh

  deny:
    name: cargo deny (advisories, licences, bans, sources)
    runs-on: ${{ github.event_name != 'pull_request' && vars.CI_RUNS_ON && fromJSON(vars.CI_RUNS_ON) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features

  test:
    name: tests (all features)
    runs-on: ${{ github.event_name != 'pull_request' && vars.CI_RUNS_ON && fromJSON(vars.CI_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: runner.environment == 'github-hosted'
      - name: unit and integration tests
        # The multi-node integration tests are timing-sensitive: one test thread,
        # and every deadline stretched ×3 on the 2-core hosted runners (TASK-239).
        env:
          PQCD_TEST_TIME_SCALE: "3"
        # pqc-hsm's softhsm feature needs libsofthsm2 on the host: it has its own job below.
        run: cargo test --workspace --exclude pqc-hsm --all-features --no-fail-fast -- --test-threads=1

  softhsm:
    name: pqc-hsm against SoftHSM
    # Always GitHub-hosted: the job installs softhsm2 with apt-get.
    runs-on: ubuntu-latest
    env:
      VIPER_HSM_TEST_MODULE: /usr/lib/softhsm/libsofthsm2.so
      VIPER_HSM_TEST_SLOT: "0"
      VIPER_HSM_TEST_PIN: "1234"
      VIPER_HSM_TEST_LABEL: viper-dev-probe-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: runner.environment == 'github-hosted'
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends softhsm2 opensc
      - run: cargo test -p pqc-hsm --features softhsm --no-fail-fast

  chart:
    name: helm lint and render
    runs-on: ${{ github.event_name != 'pull_request' && vars.CI_RUNS_ON && fromJSON(vars.CI_RUNS_ON) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - run: helm lint charts/viper-pq-chain
      - run: helm template ci charts/viper-pq-chain > /dev/null
      - name: the chart refuses ceremony values made for another release
        run: |
          if helm template ci charts/viper-pq-chain --set _release_name=other > /dev/null 2>&1; then
            echo "guard did not fire" >&2; exit 1; fi
