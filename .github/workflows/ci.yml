name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Every job runs on GitHub-hosted runners, fixed: no self-hosted runner is
# reachable from this repository.
jobs:
  lint:
    name: fmt, clippy, licences, links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: scripts/check-licenses.sh
      - run: scripts/check-links.sh

  deny:
    name: cargo deny (advisories, licences, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features

  test:
    name: tests (all features)
    runs-on: ubuntu-latest
    # about 65 min on a 4-vCPU hosted runner.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: unit and integration tests
        # The multi-node integration tests are timing-sensitive: one test thread,
        # and every deadline stretched ×3 on the 2-core hosted runners (TASK-239).
        env:
          PQCD_TEST_TIME_SCALE: "3"
        # pqc-hsm's softhsm feature needs libsofthsm2 on the host: it has its own job below.
        run: cargo test --workspace --exclude pqc-hsm --all-features --no-fail-fast -- --test-threads=1

  softhsm:
    name: pqc-hsm against SoftHSM
    # softhsm2/opensc are installed with apt-get.
    runs-on: ubuntu-latest
    env:
      VIPER_HSM_TEST_MODULE: /usr/lib/softhsm/libsofthsm2.so
      VIPER_HSM_TEST_SLOT: "0"
      VIPER_HSM_TEST_PIN: "1234"
      VIPER_HSM_TEST_LABEL: viper-dev-probe-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends softhsm2 opensc
      - run: cargo test -p pqc-hsm --features softhsm --no-fail-fast

  chart:
    name: helm lint and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - run: helm lint charts/viper-pq-chain
      - run: helm template ci charts/viper-pq-chain > /dev/null
      - name: the chart refuses ceremony values made for another release
        run: |
          if helm template ci charts/viper-pq-chain --set _release_name=other > /dev/null 2>&1; then
            echo "guard did not fire" >&2; exit 1; fi
