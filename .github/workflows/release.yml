name: release

# Tag vX.Y.Z → release binaries (linux x86_64), container images on ghcr.io
# signed with cosign (keyless), SBOMs, checksums, and a GitHub Release that
# carries all of it. The release build is the public-chain build: no token
# economics, hybrid post-quantum TLS on.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # librocksdb-sys 0.16 (RocksDB 8.10) misses <cstdint> under the GCC of the
  # current GitHub-hosted images.
  CXXFLAGS: "-include cstdint"
  RELEASE_FEATURES: --no-default-features --features hybrid-kem-tls

jobs:
  binaries:
    name: linux x86_64 binaries
    # The oldest supported hosted image, on purpose: the binaries link the
    # glibc and libstdc++ of the build host, and ubuntu-latest's (glibc 2.38+)
    # would not start on Ubuntu 22.04 or Debian 12. Built here they need
    # glibc >= 2.35 (Ubuntu 22.04+, Debian 12+).
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write   # keyless signing of the tarballs and SHA256SUMS
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: build
        run: cargo build --release $RELEASE_FEATURES -p pqcd -p viper-archival-sidecar
      - name: package
        run: |
          set -e
          v=${GITHUB_REF_NAME}
          mkdir -p dist
          out="${CARGO_TARGET_DIR:-target}/release"
          for b in pqcd viper-archival-sidecar; do
            tar -C "$out" -czf "dist/${b}-${v}-linux-x86_64.tar.gz" "$b"
          done
          cp LICENSE.md NOTICE dist/
          for b in pqcd viper-archival-sidecar; do
            need=$(objdump -T "$out/$b" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            echo "$b needs $need"
            # refuse a binary that the documented baseline cannot run
            [ "$(printf '%s\nGLIBC_2.35\n' "$need" | sort -V | tail -1)" = "GLIBC_2.35" ] || { echo "$b requires $need > GLIBC_2.35" >&2; exit 1; }
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: sign SHA256SUMS and the tarballs (keyless, Sigstore)
        # `scripts/join-testnet.sh` is meant to be piped from curl: it verifies
        # SHA256SUMS.sigstore.json against this workflow's identity before it
        # trusts any checksum.
        run: |
          set -e
          cd dist
          for f in SHA256SUMS *.tar.gz; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: SBOM (CycloneDX) of the workspace
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/viper-pq-chain-${{ github.ref_name }}.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist

  images:
    name: container images → ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        image: [pqcd, viper-archival-sidecar]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: sign (keyless, Sigstore)
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}

  publish:
    name: GitHub Release
    needs: [binaries, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Release build of Viper PQ Chain (`--no-default-features --features hybrid-kem-tls`: no token economics, hybrid post-quantum TLS).
            Binaries for Linux x86_64 with `SHA256SUMS`; `SHA256SUMS` and every tarball are signed keyless with Sigstore (`*.sigstore.json`, verify with `cosign verify-blob --bundle … --certificate-identity-regexp '^https://github.com/v1p3r4llbl4ck-86/viper-pq-chain/.github/workflows/release.yml@refs/tags/v' --certificate-oidc-issuer https://token.actions.githubusercontent.com`); container images `ghcr.io/${{ github.repository_owner }}/pqcd` and `…/viper-archival-sidecar` tagged `${{ github.ref_name }}`, signed with cosign (keyless); CycloneDX SBOM attached.
            Licences: LICENSE.md (Apache-2.0 verification path, BUSL-1.1 node, CC BY 4.0 documents).
