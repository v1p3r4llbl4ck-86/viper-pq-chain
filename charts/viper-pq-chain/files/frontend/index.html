<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Viper PQ Chain — explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; background: #0b0f14; color: #e6edf3; font-family: Inter, system-ui, sans-serif; }
    code, pre { font-family: "JetBrains Mono", ui-monospace, monospace; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- The explorer is a single JSX file compiled in the browser: no bundler,
       no build step. Versions are pinned: Babel 8 switched preset-react to the
       automatic runtime, which injects an `import` and breaks a classic script.
       It reads the node's public API (/v1/...) served on the
       same origin by the chart's ingress. -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.8/babel.min.js"></script>
  <script type="text/babel" data-presets="react" src="/viper-explorer.jsx"></script>
</body>
</html>
