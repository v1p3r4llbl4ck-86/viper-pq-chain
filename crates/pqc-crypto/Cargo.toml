[package]
name = "pqc-crypto"
description = "Post-quantum signature and KEM abstractions for PQ Chain"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
sha3.workspace = true
thiserror.workspace = true
hex.workspace = true
bech32 = "0.11"
# Secure in-memory wipe for ML-KEM decapsulation seeds (FIPS 203 `d || z`).
# The `derive` feature enables `#[derive(Zeroize, ZeroizeOnDrop)]` on KemSeed.
zeroize = { version = "1", features = ["derive"] }

[features]
stub-verifier = []
serde = []
# Real ML-DSA backend (FIPS 204). Enables MlDsaVerifier.
# Off by default so downstream crates can build without the extra dep tree in test/CI.
ml-dsa-backend = ["dep:ml-dsa"]
# Real SLH-DSA backend (FIPS 205). Enables slh_dsa_sha2_128s_* helpers.
slh-dsa-backend = ["dep:slh-dsa", "dep:rand-core-06"]
# Full post-quantum verifier: ML-DSA + SLH-DSA dispatch. Enables PqVerifier.
# Use this in production binaries. FN-DSA remains GAP-01 until FIPS 206 is finalized.
pq-verifier = ["ml-dsa-backend", "slh-dsa-backend"]
# Real ML-KEM-768 backend (FIPS 203). Enables P2P authenticated transport.
kem-backend = ["dep:ml-kem"]

[dependencies.ml-dsa]
workspace = true
optional = true

[dependencies.slh-dsa]
workspace = true
optional = true

# rand_core 0.6 provides OsRng with CryptoRngCore for calling slh-dsa's SigningKey::new().
# slh-dsa 0.1.0 depends on rand_core 0.6 (not 0.9), so callers must use the 0.6 API.
[dependencies.rand-core-06]
package = "rand_core"
version = "0.6"
features = ["getrandom"]
optional = true

[dependencies.ml-kem]
workspace = true
optional = true

[dev-dependencies]
# KAT test vectors loaded from JSON fixtures
serde.workspace = true
serde_json = "1"
# Real RNG for ml-dsa-backend round-trip tests (must match ml-dsa's rand_core v0.10)
getrandom.workspace = true
criterion.workspace = true

[[bench]]
name = "sig_verify"
harness = false
required-features = ["ml-dsa-backend"]

# ACVP (FIPS 204 / FIPS 205) conformance harness — TASK-154.
# Gated behind the full `pq-verifier` feature so `cargo test -p pqc-crypto`
# with default features stays fast. Tests inside are additionally `#[ignore]`d,
# so they only run with `--ignored`.
[[test]]
name = "acvp_conformance"
required-features = ["pq-verifier"]
