---
# build-deploy.yml — git pull + cargo build --release + restart
#
# Use this after merging code changes (Rust or config templates) when you
# do NOT need to re-run common/rust/firewall provisioning steps.
#
# Steps:
#   1. build   — git pull + cargo build --release -p pqcd --features hybrid-kem-tls + install binary
#   2. configure — regenerate node.json and systemd unit from templates
#   3. deploy  — restart and wait for readiness
#
# Notary is rebuilt/restarted on the validator if viper_role == 'validator'.

- name: Build and deploy Viper PQ Chain (code changes)
  hosts: all
  become: yes
  gather_facts: yes

  roles:
    - build
    - configure
    - deploy
    - role: notary
      when: viper_role == 'validator'

  post_tasks:
    - name: Print deployment summary
      debug:
        msg: >-
          {{ viper_node_id }} ({{ viper_role }}) updated.
          Binary: {{ viper_binary_path }}
          {% if viper_role == 'validator' %}
          API: http://{{ ansible_host }}:{{ viper_api_port }}/v1/status
          {% endif %}
