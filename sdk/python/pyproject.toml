[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viper-pqchain"
version = "0.3.0"
description = "Python SDK for Viper PQ Chain — post-quantum trust infrastructure, aligned with the viper-pq-1 launch architecture (ADR-053). 0.3.0 adds typed read methods for the algorithm registry, single-validator detail, account attestation listing and on-chain governance proposals + votes."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
    { name = "Viper PQ Chain contributors" },
]
keywords = [
    "viper",
    "viper-pq-1",
    "pq-chain",
    "post-quantum",
    "blockchain",
    "ml-dsa",
    "slh-dsa",
    "sdk",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/v1per-pqchain/viper-pqchain"
Documentation = "https://docs.viper-pqchain.io"
Repository = "https://github.com/v1per-pqchain/viper-pqchain"
Issues = "https://github.com/v1per-pqchain/viper-pqchain/issues"
Changelog = "https://github.com/v1per-pqchain/viper-pqchain/blob/main/sdk/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["viper_pqchain*"]
