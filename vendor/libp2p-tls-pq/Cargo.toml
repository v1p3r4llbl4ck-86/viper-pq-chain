# Patch notes (PQ Chain vendor copy, 2026-05-11):
# - Additive injection seam for `rustls::crypto::CryptoProvider`. The upstream
#   0.6.2 release hard-codes `rustls::crypto::ring::default_provider()` at
#   every call site; this patch keeps that as the default but lets a caller
#   override it via two new functions:
#       make_client_config_with_provider(keypair, remote_peer_id, custom_provider)
#       make_server_config_with_provider(keypair, custom_provider)
#   and a new constructor on the upgrade Config:
#       Config::new_with_provider(identity, provider)
# - Existing `make_{client,server}_config` and `Config::new` stay exact —
#   they delegate to the new variants with `None`.
# - Default-provider construction is hoisted into a private helper
#   `default_libp2p_provider()` so the cipher-suite list mutation
#   (`provider.cipher_suites = verifier::CIPHERSUITES.to_vec()`) is no longer
#   duplicated.
# - No other changes — verifier.rs, certificate.rs, upgrade.rs (other than
#   Config::new_with_provider) are byte-identical to upstream 0.6.2.
# - Patch surface: ~50 LOC across src/lib.rs and src/upgrade.rs.
# - Reason: libp2p-tls 0.6.2 has no injection seam for CryptoProvider, so
#   consumers cannot plug in `rustls-post-quantum` to enable X25519MLKEM768
#   hybrid TLS. Tracking upstream: libp2p/rust-libp2p#6236 (no movement
#   since 2025-12-28). Vendored fork drops the day #6236 lands; see
#   the private design notes
